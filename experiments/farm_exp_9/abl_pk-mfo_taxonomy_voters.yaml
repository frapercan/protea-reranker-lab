schema_version: v1
name: farm_exp_9_abl_pk-mfo_taxonomy_voters
description: 'FARM-EXP.9 ablation re-run on bench-v1-K5-filtered. Cell=pk-mfo, drop=taxonomy_voters.
  Ablation: additionally drops taxonomy_voters (3 features) on top of leakage drop.
  Tests importance of taxonomy_voters on leakage-free eval. NOT comparable to pre-leakage
  bench-v1-K5 runs.'
dataset:
  manifest: datasets/bench-v1-K5-filtered/manifest.json
model:
  kind: lgbm_reranker
  defaults:
    objective: lambdarank
    num_boost_round: 5000
    early_stopping_rounds: 50
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 100
    drop_features:
    - anc2vec_has_emb
    - anc2vec_neighbor_cos
    - anc2vec_neighbor_maxcos
    - anc2vec_query_known_cos
    - anc2vec_query_known_count
    - anc2vec_query_known_maxcos
    - emb_pca_query_0
    - emb_pca_query_1
    - emb_pca_query_10
    - emb_pca_query_11
    - emb_pca_query_12
    - emb_pca_query_13
    - emb_pca_query_14
    - emb_pca_query_15
    - emb_pca_query_2
    - emb_pca_query_3
    - emb_pca_query_4
    - emb_pca_query_5
    - emb_pca_query_6
    - emb_pca_query_7
    - emb_pca_query_8
    - emb_pca_query_9
    - tax_voters_close_frac
    - tax_voters_mean_common_ancestors
    - tax_voters_same_frac
training:
  cell: pk-mfo
  val_strategy: temporal
  val_holdout_snapshot: v215-v220
  val_fraction: 0.2
  seed: 42
  propagate_labels: false
sweep:
  backend: none
output_dir: runs/transversal/farm_exp_9_abl_pk-mfo_taxonomy_voters
tags:
- farm_exp_9
- study_v9_ablation_rerun
- bench-v1-K5-filtered
- pk-mfo
- drop_taxonomy_voters
keep_staging: false
