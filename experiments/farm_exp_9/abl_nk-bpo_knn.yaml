schema_version: v1
name: farm_exp_9_abl_nk-bpo_knn
description: 'FARM-EXP.9 ablation re-run on bench-v1-K5-filtered. Cell=nk-bpo, drop=knn.
  Ablation: additionally drops knn (7 features) on top of leakage drop. Tests importance
  of knn on leakage-free eval. NOT comparable to pre-leakage bench-v1-K5 runs.'
dataset:
  manifest: datasets/bench-v1-K5-filtered/manifest.json
model:
  kind: lgbm_reranker
  defaults:
    objective: lambdarank
    num_boost_round: 5000
    early_stopping_rounds: 50
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 100
    drop_features:
    - anc2vec_has_emb
    - anc2vec_neighbor_cos
    - anc2vec_neighbor_maxcos
    - anc2vec_query_known_cos
    - anc2vec_query_known_count
    - anc2vec_query_known_maxcos
    - distance
    - emb_pca_query_0
    - emb_pca_query_1
    - emb_pca_query_10
    - emb_pca_query_11
    - emb_pca_query_12
    - emb_pca_query_13
    - emb_pca_query_14
    - emb_pca_query_15
    - emb_pca_query_2
    - emb_pca_query_3
    - emb_pca_query_4
    - emb_pca_query_5
    - emb_pca_query_6
    - emb_pca_query_7
    - emb_pca_query_8
    - emb_pca_query_9
    - k_position
    - neighbor_distance_std
    - neighbor_mean_distance
    - neighbor_min_distance
    - neighbor_vote_fraction
    - vote_count
training:
  cell: nk-bpo
  val_strategy: temporal
  val_holdout_snapshot: v215-v220
  val_fraction: 0.2
  seed: 42
  propagate_labels: false
sweep:
  backend: none
output_dir: runs/transversal/farm_exp_9_abl_nk-bpo_knn
tags:
- farm_exp_9
- study_v9_ablation_rerun
- bench-v1-K5-filtered
- nk-bpo
- drop_knn
keep_staging: false
