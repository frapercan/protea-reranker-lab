# ReadTheDocs build configuration for protea-reranker-lab.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    # Docs toolchain: myst-parser + sphinx-copybutton + sphinx-rtd-theme,
    # wired in docs/source/conf.py.
    - requirements: docs/requirements-docs.txt
    # The package itself so autodoc can import its modules. Heavy runtime
    # deps (lightgbm, numpy, pandas, ...) are mocked via
    # autodoc_mock_imports in conf.py.
    - method: pip
      path: .
