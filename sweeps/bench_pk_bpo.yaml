program: src/protea_reranker_lab/train.py
project: protea-reranker-bench
method: bayes
metric:
  name: test_fmax
  goal: maximize
parameters:
  dataset:
    value: datasets/bench-v1-K5
  cell:
    value: pk-bpo
  objective:
    values: [lambdarank, binary]
  val_strategy:
    value: temporal
  temporal_holdout:
    value: v215-v220
  learning_rate:
    distribution: log_uniform_values
    min: 0.01
    max: 0.3
  num_leaves:
    values: [31, 63, 127, 255, 511]
  min_data_in_leaf:
    values: [20, 50, 100, 200, 500]
  feature_fraction:
    distribution: uniform
    min: 0.6
    max: 1.0
  bagging_fraction:
    distribution: uniform
    min: 0.6
    max: 1.0
  neg_pos_ratio:
    values: [null, 5, 10]
  val_fraction:
    values: [0.05, 0.1, 0.2]
  num_boost_round:
    value: 5000
  early_stopping_rounds:
    value: 50
command:
  - ${env}
  - /home/frapercan/Thesis/repositories/protea-reranker-lab/.venv/bin/python
  - -m
  - protea_reranker_lab.train
  - ${args}
