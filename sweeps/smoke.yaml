program: src/protea_reranker_lab/train.py
project: protea-reranker-smoke
method: bayes
metric:
  name: test_fmax
  goal: maximize
parameters:
  dataset:
    value: datasets/smoke-K5
  cell:
    value: pk-bpo
  objective:
    values: [lambdarank, binary]
  val_strategy:
    value: protein_group
  learning_rate:
    distribution: log_uniform_values
    min: 0.02
    max: 0.2
  num_leaves:
    values: [31, 63, 127]
  min_data_in_leaf:
    values: [50, 100, 200]
  feature_fraction:
    distribution: uniform
    min: 0.7
    max: 1.0
  bagging_fraction:
    distribution: uniform
    min: 0.7
    max: 1.0
  neg_pos_ratio:
    values: [null, 5, 10]
  val_fraction:
    value: 0.2
  num_boost_round:
    value: 2000
  early_stopping_rounds:
    value: 50
command:
  - ${env}
  - /home/frapercan/Thesis/repositories/protea-reranker-lab/.venv/bin/python
  - -m
  - protea_reranker_lab.train
  - ${args}
