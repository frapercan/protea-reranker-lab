[project]
name = "protea-reranker-lab"
version = "0.2.0"
description = "Research sandbox for iterating on PROTEA's GO-term reranker."
authors = [{name = "Francisco Miguel Pérez Canales", email = "frapercan1@alum.us.es"}]
requires-python = ">=3.12,<4.0"
license = {text = "Unlicense"}
classifiers = [
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "lightgbm>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "wandb>=0.16",
    "pyyaml>=6",
    "protea-contracts @ git+https://github.com/frapercan/protea-contracts.git@cc30bc5e1b658ecf527bf3db08df66e655f4cb27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.0",
]
# Extras for scripts/train_native_boosters.py: the direct-MinIO-SDK dataset
# fallback (--minio-fallback) and the gated MLflow tracking. Kept optional so
# the core lab install stays light (lightgbm + pyarrow already cover training).
native = [
    "minio>=7.2",
    "mlflow-skinny>=2.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "slow: marks tests as slow (runs cafaeval or other heavy subprocesses; deselect with -m 'not slow')",
]

[dependency-groups]
dev = [
    "sphinx (>=7)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "myst-parser (>=2)",
    "sphinx-copybutton (>=0.5)",
    "mypy (>=2.1.0,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.mypy]
python_version = "3.12"
files = ["src/protea_reranker_lab"]
ignore_missing_imports = true

# pyarrow ships ``py.typed`` but its ``compute`` namespace is populated at
# import time, so functions such as ``pc.unique`` / ``pc.equal`` are invisible
# to the static checker and raise spurious ``attr-defined`` errors. Treat the
# heavy native deps as untyped instead of scattering per-line ``# type: ignore``.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "lightgbm.*", "wandb.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
