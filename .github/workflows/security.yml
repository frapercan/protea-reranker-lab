name: security

on:
  push:
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC: catches new CVEs against pinned deps
    # even when no PR is open.
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit on PEP 621 deps (no install, skips private git deps)
        # Research sandbox: surface CVEs so the user sees them, but
        # do not block iteration. We extract dependencies directly from
        # pyproject.toml, skip git+https entries (private repos
        # unreachable from the lab's GITHUB_TOKEN scope), and audit the
        # resulting requirements file. No install means no transitive
        # private-repo git clones and no auth failures in CI.
        run: |
          python - <<'PY' > /tmp/req.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          for dep in data["project"].get("dependencies", []):
              if "git+" in dep or "@ file:" in dep:
                  continue
              print(dep)
          PY
          pip-audit --strict --vulnerability-service osv -r /tmp/req.txt || true

  bandit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bandit
        run: pip install "bandit[toml]"
      - name: Run bandit on src/ (HIGH severity, HIGH confidence)
        run: bandit --severity-level high --confidence-level high -r src/ || true
