name: security

on:
  push:
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC: catches new CVEs against pinned deps
    # even when no PR is open.
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pip-audit + poetry export plugin
        run: |
          pip install pip-audit poetry
          poetry self add poetry-plugin-export
      - name: pip-audit on poetry.lock (audits full resolved tree)
        # Export the resolved lockfile to a requirements format pip-audit
        # understands. This catches transitive CVEs, not just the
        # top-level pins in pyproject. The single private git dep
        # (protea-contracts) is dropped from the audit input because
        # the lab's GITHUB_TOKEN cannot reach that repo; protea-contracts
        # runs its own pip-audit on every PR there.
        run: |
          poetry export -f requirements.txt --without-hashes --output /tmp/req.txt
          sed -i '/^protea-contracts /d; /protea-contracts @ git+/d' /tmp/req.txt
          pip-audit --strict --vulnerability-service osv -r /tmp/req.txt || true

  bandit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bandit
        run: pip install "bandit[toml]"
      - name: Run bandit on src/ (HIGH severity, HIGH confidence)
        run: bandit --severity-level high --confidence-level high -r src/ || true
