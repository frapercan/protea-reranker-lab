name: publish

# Publishes the package to PyPI via Trusted Publishing (OIDC, no API
# token stored in the repo). This runs only when a GitHub Release is
# published, so it never fires on ordinary pushes or pull requests.
#
# Prerequisites (one-time, manual, outside this workflow):
#   1. The distribution name "protea-reranker-lab" must be registered on
#      PyPI (or available for first upload).
#   2. A PyPI trusted publisher must be configured for this repository,
#      workflow "publish.yml", and environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel (setuptools backend)
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
