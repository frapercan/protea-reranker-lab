name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: pipx install poetry
      - name: Install lab + dev deps
        run: poetry install --quiet
      - name: Ensure pytest is available
        # pytest is declared under [project.optional-dependencies].dev
        # and [dependency-groups].dev; pin install regardless so CI
        # never needs a "fix CI" follow-up when the lockfile group flips.
        run: poetry run pip install --quiet pytest
      - name: Run pytest
        # Excludes one pre-existing test that requires the local
        # `runs/transversal/farm_exp_9_rep_*` artefacts, which are
        # researcher-only and not checked into the repo.
        run: |
          poetry run pytest -q tests/ \
            --deselect tests/test_farm_exp_9_partial.py::TestCompletedRunJSON::test_at_least_one_completed_run_exists
