name: docs

# Builds the Sphinx documentation with warnings treated as errors so a
# broken cross-reference, a malformed docstring, or a missing toctree
# entry fails the pull request rather than rotting silently.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install docs dependencies
        # autodoc imports the package, so install the lab (editable) plus
        # the Sphinx toolchain. Heavy runtime deps still get mocked in
        # conf.py, which keeps the build resilient if a wheel is missing.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements-docs.txt
      - name: Build HTML (warnings as errors)
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html
      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html
          retention-days: 14
