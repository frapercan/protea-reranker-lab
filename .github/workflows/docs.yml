name: docs

# Builds the Sphinx documentation with warnings treated as errors so a
# broken cross-reference, a malformed docstring, or a missing toctree
# entry fails the pull request rather than rotting silently. On pushes to
# the default branch the built HTML is deployed to GitHub Pages.

on:
  pull_request:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of the same
# group so a newer push supersedes an older Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install docs dependencies
        # autodoc imports the package, so install the lab (editable) plus
        # the Sphinx toolchain. Heavy runtime deps still get mocked in
        # conf.py, which keeps the build resilient if a wheel is missing.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements-docs.txt
      - name: Build HTML (warnings as errors)
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Publish to GitHub Pages only for pushes to the default branch; pull
    # requests build (above) for validation but never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
